<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Consultation | Pet Care Clinic</title>
  <link rel="stylesheet" href="../CSS/dashboard.css">
  <link rel="stylesheet" href="../CSS/consultation.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">✢</span>
      <span>Pet Care Clinic</span>
    </div>

    <nav class="nav">
      <a href="../HTML/dashboard.html"><span class="dot"></span>Dashboard</a>
      <a href="../HTML/pets.html"><span class="dot"></span>My Pets</a>
      <a href="../HTML/book.html"><span class="dot"></span>Book Appointment</a>
      <a href="../HTML/appointments.html"><span class="dot"></span>My Appointments</a>
      <a href="../HTML/consultation.html" class="active"><span class="dot"></span>Online Consultation</a>
      <a href="../HTML/records.html"><span class="dot"></span>Medical Records</a>
      <a href="../HTML/billing.html"><span class="dot"></span>Billing</a>
      <a href="../HTML/notifications.html"><span class="dot"></span>Notifications</a>
      <a href="../HTML/profile.html"><span class="dot"></span>Profile / Settings</a>
    </nav>

    <button type="button" class="logout" id="logoutBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Logout
    </button>
  </aside>

  <main class="main">
    <div class="content">

      <header class="topbar">
        <div>
          <h1>Online Consultation</h1>
        </div>

        <div class="user-area">
          <button type="button" class="bell" id="bellBtn" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="bell-badge" id="bellBadge">3</span>
          </button>

          <div class="user-menu-wrap">
            <button type="button" class="user-btn" id="userBtn">
              <span class="avatar" id="userAvatar">JS</span>
              <span id="userName">Justine Salido</span>
              <span class="caret"></span>
            </button>
            <div class="user-menu" id="userMenu">
              <a href="../HTML/profile.html">Profile / Settings</a>
              <button type="button" id="menuLogout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <section class="consult-layout">
        
        <aside class="convo-panel">
          <h2>Conversations</h2>
          <div class="convo-list" id="convoList"></div>
        </aside>

        <section class="chat-panel">
          <div class="chat-head">
            <h2 id="chatName"></h2>
            <p class="chat-status" id="chatStatus"></p>
          </div>

          <div class="messages" id="messages"></div>

          <form class="chat-form" id="chatForm" autocomplete="off">
            <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500">
            <button type="submit">Send</button>
          </form>
        </section>
        
      </section>

    </div>
  </main>

  <script src="../JS/consultation.js"></script>
</body>
</html>
