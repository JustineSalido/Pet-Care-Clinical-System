<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Records | Pet Care Clinic</title>
  <link rel="stylesheet" href="../CSS/dashboard.css">
  <link rel="stylesheet" href="../CSS/records.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">✢</span>
      <span>Pet Care Clinic</span>
    </div>

    <nav class="nav">
      <a href="../HTML/dashboard.html"><span class="dot"></span>Dashboard</a>
      <a href="../HTML/pets.html"><span class="dot"></span>My Pets</a>
      <a href="../HTML/book.html"><span class="dot"></span>Book Appointment</a>
      <a href="../HTML/appointments.html"><span class="dot"></span>My Appointments</a>
      <a href="../HTML/consultation.html"><span class="dot"></span>Online Consultation</a>
      <a href="../HTML/records.html" class="active"><span class="dot"></span>Medical Records</a>
      <a href="../HTML/billing.html"><span class="dot"></span>Billing</a>
      <a href="../HTML/notifications.html"><span class="dot"></span>Notifications</a>
      <a href="../HTML/profile.html"><span class="dot"></span>Profile / Settings</a>
    </nav>

    <button type="button" class="logout" id="logoutBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Logout
    </button>
  </aside>

  <main class="main">
    <div class="content">

      <header class="topbar">
        <div>
          <h1>Medical Records</h1>
        </div>

        <div class="topbar-right">
          <div class="user-area">
            <button type="button" class="bell" id="bellBtn" aria-label="Notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="bell-badge hidden" id="bellBadge">0</span>
            </button>

            <div class="user-menu-wrap">
              <button type="button" class="user-btn" id="userBtn">
                <span class="avatar" id="userAvatar"></span>
                <span id="userName"></span>
                <span class="caret"></span>
              </button>
              <div class="user-menu" id="userMenu">
                <a href="#">Profile / Settings</a>
                <button type="button" id="menuLogout">Logout</button>
              </div>
            </div>
          </div>

          <select id="petSelect" class="pet-select" aria-label="Select pet"></select>
        </div>
      </header>

      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-tab="vaccinations">Vaccinations</button>
        <button type="button" class="tab" data-tab="diagnoses">Diagnoses</button>
        <button type="button" class="tab" data-tab="treatments">Treatments</button>
        <button type="button" class="tab" data-tab="prescriptions">Prescriptions</button>
      </div>

      <section class="rec-card">
        <h2 id="recordsTitle">Vaccination Records</h2>
        <div class="table-wrap" id="recordsBox"></div>
      </section>

      <section class="rec-card">
        <h2>Medical History</h2>
        <div class="table-wrap" id="historyBox"></div>
      </section>

    </div>
  </main>

  <script src="../JS/records.js"></script>
</body>
</html>
