<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Pet Care Clinic</title>
  <link rel="stylesheet" href="../CSS/register.css">
</head>
<body>
  <main class="register-wrapper">

    <!-- Left: Register card -->
    <section class="register-card">
      <div class="logo">
        <span class="logo-icon">✢</span>
        <span class="logo-text">Pet Care Clinic</span>
      </div>

      <div class="register-content">
        <h1>Create Account</h1>
        <p class="subtitle">Join our pet care family</p>

        <form id="registerForm" novalidate>
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email">

          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username">

          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Create a password">
          </div>

          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter your password">
          </div>

          <div class="terms">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the Terms and Privacy Policy</label>
          </div>

          <button type="submit" class="btn-register">Create Account</button>
        </form>

        <p class="login-text">
          <a href="../HTML/login.html">Already have an account? Login</a>
        </p>
      </div>
    </section>

    <!-- Right: the whole box is the image -->
    <section class="photo-panel">
      <img src="../IMG/pets_.jpg" alt="Pet">
      <h2>Because<br>they're family</h2>
    </section>

  </main>

  <script src="../JS/register.js"></script>
</body>
</html>
